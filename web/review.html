<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local-only editorial review of startup research drafts."><title>Research Review Studio — Startup Radar</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="review.css"></head>
<body><header><a class="logo" href="./">✳ startup<span>radar</span></a><nav><a href="./#daily-research" id="review-back">← Daily research</a><a href="https://github.com/supplicant-snowstain/startup-product-radar/actions/workflows/research-drafts.yml" target="_blank" rel="noopener noreferrer">Draft artifacts ↗</a><label class="language-control"><span class="sr-only">Language</span><select id="language" aria-label="Language / 语言 / Langue"><option value="en">EN</option><option value="zh">中文</option><option value="fr">FR</option></select></label></nav></header>
<main class="review-page"><section class="review-heading"><small>EDITORIAL TOOLS / LOCAL ONLY</small><h1 id="review-title">Research Review Studio</h1><p id="review-intro"></p><p id="review-privacy" class="review-note"></p></section>

<section class="review-panel"><h2 id="review-next-title">Publishing workflow</h2><p id="review-next"></p><a href="https://github.com/supplicant-snowstain/startup-product-radar/blob/main/data/research_intelligence.json" target="_blank" rel="noopener noreferrer" id="review-target">Reviewed intelligence file ↗</a></section></main>
