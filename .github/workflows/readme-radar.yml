name: Refresh README research radar

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'index/products.csv'
      - 'tools/update_readme_radar.py'
      - '.github/workflows/readme-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-radar-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate README research section
        run: python tools/update_readme_radar.py --root .
      - name: Commit only if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh latest research radar"
          git push
