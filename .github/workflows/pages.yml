name: Publish Opportunity Explorer
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'reports/**'
      - 'index/products.csv'
      - 'data/research_intelligence.json'
      - 'tools/build_research_feed.py'
      - 'tools/test_research_feed.py'
      - 'tools/validate_research_intelligence.py'
      - 'data/provisional/**'
      - 'data/products/**'
      - 'data/product_candidates/**'
      - 'tools/startup_lab/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate public feed
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m startup_lab.public_feed --root . --output web/signals.json
      - name: Generate product feed
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m startup_lab.product_feed --root . --output web/products.json
      - name: Generate research observations feed (not a launch feed)
        run: python tools/build_research_feed.py --root . --output web/research.json
      - name: Test research feed isolation
        run: python tools/test_research_feed.py
      - name: Validate curated research intelligence
        run: python tools/validate_research_intelligence.py --root .
      - name: Validate daily candidate queue
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m startup_lab.validate_candidates --root .
      - name: Run tests against generated site data
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m unittest discover -s tools/startup_lab/tests -v
      - name: Generate deployment status manifest
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m startup_lab.site_status --web web --output web/site-status.json
      - name: Verify static site and published feeds
        env:
          PYTHONPATH: tools/startup_lab
        run: python -m startup_lab.check_site
      - name: Verify browser JavaScript syntax
        run: |
          for file in web/*.js; do node --check "$file"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
